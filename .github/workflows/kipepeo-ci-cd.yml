#configure ci/cd name
name: Build and push docker image


on:
  push:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code from repository to running machine
        uses: actions/checkout@v4
      - name: set up jdk into ubuntu running machine
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: running maven command in order to create jar file
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
      - name: uploaddinng artifact to github
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-artifact
          path: target/*.jar
  # Configure the AWS credentials in order to allow to access the repository for deployment
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: downloading the code from github
        uses : actions/checkout@v4
      - name: downloading the artifact
        uses: actions/download-artifact@v4
        with:
          name: maven-build-artifact
          path: target
      - name: Login to ECR with credentials
        uses: aws-actions/aws-configure-credentials@v4
        with:
          aws-access-key-id: ${{secrets.ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.ACCESS_SECRET_KEY}}
          aws-region: eu-north-1
      # login to ecr
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
  # build, tag and push image to amazon ecr
      - name: build,tag and push image to amazon ECR
        env:
          ECR_REGISTRY: ${{steps.ecr-login.outputs.registry}}
          ECR_REPOSITORY: KIPEPEO-REPO
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG






